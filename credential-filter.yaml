name: Credential Filter
shortDescription: Allow, block, or redact credentials in MCP tool requests and responses.
description: Locally scans MCP request and response messages with Titus credential detection rules.
metadata:
  categories: Security
repoURL: https://github.com/obot-platform/credential-filter
runtime: containerized
containerizedConfig:
  image: ghcr.io/obot-platform/credential-filter:v0.1.0
  port: 8080
  path: /mcp
systemMCPServerType: filter
filterConfig:
  toolName: filter_credentials
config:
  - key: CREDENTIAL_DEFAULT_ACTION
    usage: env
    name: Default credential action
    description: allow, block, or redact. Defaults to block when unset.
  - key: CREDENTIAL_ALLOW_RULES
    usage: env
    name: Allowed credential rules
    description: Comma-separated exact Titus rule IDs that override the default action.
  - key: CREDENTIAL_BLOCK_RULES
    usage: env
    name: Blocked credential rules
    description: Comma-separated exact Titus rule IDs that override the default action.
  - key: CREDENTIAL_REDACT_RULES
    usage: env
    name: Redacted credential rules
    description: Comma-separated exact Titus rule IDs that override the default action.
toolPreview:
  - name: filter_credentials
    description: Inspect a full MCP message and return an Obot filter decision.
    params:
      message: Full MCP JSON-RPC message
